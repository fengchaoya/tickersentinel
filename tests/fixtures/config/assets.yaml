# 测试用的资产清单（存储芯片这组样本的冻结副本）；字段说明见 config/assets.yaml。
# 盯哪些资产、每个资产的警报灵敏度。
# 增删持仓、调灵敏度都改这个文件；每个持仓用 theme 指向 config/themes/ 里的一个主题（板块联动：基准、同业、夜间信号、
# 相关公司、检索词、板块指标都在主题里，同一板块的持仓共用）。正在运行的 `tsen run` 一分钟内自动读到，不用重启；`tsen scope` 查看当前的监控范围。
# 调阈值前后可以用 `tsen assets` 看各资产最近的波动有多大、当前阈值相当于几倍波动，用 `tsen replay --days 10` 看会推送多少条。
#
# 警报规则（每个资产都可以单独设，不写就用下面 defaults 里它所属类别的默认值）：
#   rapid_pct   急涨急跌：{窗口分钟: 下限%}。最近这么多分钟里的最高点到现价跌了这么多（或最低点到现价涨了这么多），
#               同时 z 值超过 z（相对它自己近 5 天的波动足够反常）。数字越小越灵敏。
#               例：{5: 1.5, 15: 2.5, 30: 3, 60: 3} = 5 分钟内从高点回落 1.5%、……、60 分钟内回落 3%（“先涨 2% 再跌到 -1%”会推）。
#   z           z 值下限（默认 4）：越小越灵敏。
#   day_pct     全天累计：从“昨收与今天最高点里更高的那个”算起跌了这么多（涨的方向对称）时推送，每一档推一次；
#               创出新的高 / 低点后重新计。负责跳空、几个小时的一路下跌、慢速的冲高回落。旧名 levels_pct 也认。
#   hours       只对美股：extended = 盘前 4:00 + 盘中 + 盘后到 20:00（美东）；regular = 只盯 9:30–16:00。
# 默认值按日波动约 5% 的股票（如美股存储芯片股）定；波动不同的资产按比例换算——`tsen scope tune 代码` 会按它最近的日波动给建议，
# 并回放最近 10 个交易日对比推送量（纯计算，不用大模型）。
#
# 资产类别 class：
#   us_equity       美股 / 美股 ADR。参照价：盘前、盘中 = 昨收；盘后 = 当天收盘（盘后的“全天 8%”从今天收盘算起）。
#   foreign_equity  海外股票（.KS 首尔、.T 东京……），按当地交易所的交易时段盯。
#   future          期货（黄金 GC=F、白银 SI=F、原油 CL=F……），CME 几乎 24 小时交易（美东 18:00 到次日 17:00）。
#                   参照价 = 上一个交易时段结束（美东 17:00）时的价格。
#   crypto          加密货币（BTC-USD……），全天候，参照价 = UTC 0 点。
#
# 其他字段：
#   theme           属于哪个主题（config/themes/<主题>.yaml）；属于多个时写成列表，第一个是主主题（决定板块基准）。
#   holding: false  只盯盘、不算持仓（不进简报的持仓列表、不单独检索新闻）；related_to 写它对应哪些持仓，异动时按它们找新闻。
#                   主题里的夜间信号（overnight）会自动成为只盯盘的资产，不用写在这里；这里写了的以这里为准（例如要单独调阈值）。
#   monitor: false  不做异动检测（仍然出现在简报、新闻、对话里）。
#   queries         新闻检索词（按语言）；underlying / adr_ratio / fx_symbol：ADR 的主上市股票、换算比例、汇率；
#   note            补充背景，会写进所有提示词（模型不知道的新事实）。
#
# 关于“24 小时”：美股在美东 20:00–04:00 的夜盘（Blue Ocean 等）没有免费数据源，这段时间靠亚洲同一家公司 / 同业
# （主题里的 overnight，存储芯片是首尔的 000660.KS）盯着；免费数据里期货与利率约延迟 10 分钟。

defaults:
  us_equity:
    hours: extended
    rapid_pct: {5: 1.5, 15: 2.5, 30: 3, 60: 3}
    z: 4.0
    day_pct: [5, 8, 12]
  foreign_equity:
    rapid_pct: {5: 1.5, 15: 2.5, 30: 3, 60: 3}
    z: 4.0
    day_pct: [5, 8, 12]
  future:                        # 黄金一天 ±2% 已经是大行情，所以比个股灵敏得多
    rapid_pct: {5: 0.6, 15: 1.0, 30: 1.4, 60: 1.4}
    z: 4.0
    day_pct: [1.5, 2.5, 4]
  crypto:
    rapid_pct: {5: 1.5, 15: 2.5, 30: 3, 60: 3}
    z: 4.0
    day_pct: [5, 8, 12]

assets:
  - symbol: MU
    name: 美光 Micron
    class: us_equity
    theme: memory                # config/themes/memory.yaml
    queries:                     # 新闻检索词，按语言分组（对应 settings.yaml 里的 Google News 版本）
      en: ["Micron Technology", "Micron stock"]
      zh: ["美光科技"]
      ko: ["마이크론"]

  - symbol: SNDK
    name: 闪迪 Sandisk
    class: us_equity
    theme: memory
    queries:
      en: ["Sandisk stock", "Sandisk NAND"]
      zh: ["闪迪"]

  - symbol: SKHY
    name: SK海力士 ADR
    class: us_equity
    theme: memory
    queries:
      en: ["SK hynix"]
      ko: ["SK하이닉스"]
      zh: ["SK海力士"]
    underlying: "000660.KS"      # 首尔主上市；10 份 ADR = 1 股普通股
    adr_ratio: 10
    fx_symbol: "KRW=X"           # 美元兑韩元，用于计算 ADR 折合价
    note: "2026-07-10 在纳斯达克上市，是公司正式发行的 ADR（不是 OTC 的 SKHYY）；上市以来相对首尔股价长期溢价，均值约 +36%；按韩国法规，超过最初存入数量的普通股再存入需公司同意，ADS 供给基本封顶，跨市场套利受限"

  # 夜里（美东 20:00–02:30）盯首尔的 SK海力士正股：写在主题 memory 的 overnight 里，自动成为只盯盘的资产

  # ── 以后持有黄金 / 白银时，去掉下面的 # 即可（阈值是示例，可以先用 tsen assets 看看它们最近的波动再定） ──
